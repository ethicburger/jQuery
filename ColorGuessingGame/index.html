<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Color Guessing Game</title>
</head>
<body>
    <h1>Color Guessing Game</h1>

    <div id="start">
        Start Game
    </div>

    <div id="gamearea">
        <div id="findme">
            Match this color
        </div>

        <span id="message"></span>

        <div id="output"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function() {
            var colorArray = [];

            $('#gamearea').hide();
            $('#output').on('click', '.cell', checkCell);

            //start game on click
            $('#start').click(startGame);
            $('#start').css({
                'border': '1px solid black',
                'text-align': 'center',
                'padding': '10px',
                'width': '150px',
                'background-color': 'red',
                'font-size': '2em',
                'margin-bottom': '10px',
                'color': '#fff'    
            });

            $('#findme').css({
                'border': '1px solid black',
                'text-align': 'center',
                'padding': '0',
                'width': '400px',
                'height': '40px',
                'display': 'inline-block',
                'font-size': '2em'
            });

            function startGame() {
                makeBoard();
                pickColor();
                $('#start').hide();
                $('#gamearea').show();
                console.log('Game Started');
            }

            function addNewcolor() {
                var color = randomColor();
                colorArray.push(color);

                return color;
            }

            function makeBoard() {
                var x = 4;
                var html = '';
                
                for(var row=0; row<x; row++) {
                    html += '<div class="row">'
                    for(var col=0; col<x; col++) {
                        html += '<div class="cell" style="background-color: ' + addNewcolor() + '"">0</div>'
                    }
                    html += '</div';
                }

                $('#output').html(html);

                applyBoardStyling();
            }


            function pickColor() {
                var index = Math.floor(Math.random() * colorArray.length);
                var pickedColor = colorArray.splice(index, 1);
                
                $('#findme').css('background-color', pickedColor);
            }

            function applyBoardStyling() {
                $('.cell').css({
                    'border': '1px solid black',
                    'text-align': 'center',
                    'padding': '0',
                    'margin': '0',
                    'width': '100px',
                    'height': '100px',
                    'font-size': '2em',
                    'color': '#000',
                    'display': 'inline-block'
                });
            }

            function randomColor() {
                return `#${((1<<24)*Math.random() | 0).toString(16)}`;
            }

            function checkCell() {
                var currentColor = $(this).css('background-color');
                
                if (currentColor == $('#findme').css('background-color')) {
                    var number = Number($(this).text());
                    number++;
                    $(this).css('background-color', addNewcolor());
                    $(this).text(number);
                    pickColor();
                } else {
                    console.log("error");
                }
            }
        });
    </script>
</body>
</html>
